# ============================================================================
#
# Zensical configuration for Docs
#
# ============================================================================

[project]
site_name = "Documentation"
docs_dir = "."
site_dir = "site"
site_description = "Documentation"
site_author = "bguiguen56"
# site_url = 
copyright = "Copyright &copy; 2026 bguiguen56"

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/my-personal-technology-stack/docs"

[[project.nav]]
"Home" = "index.md"

[[project.nav]]
"Overview" = ["overview/architecture.md"]

[[project.nav]]
"Getting Started" = ["getting-started/installation.md"]

[[project.nav]]
"Maintenance" = ["maintenance/updates.md"]